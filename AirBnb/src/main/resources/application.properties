spring.application.name=AirBnb

# Connection URL format -> jdbc:postgresql://<host>:<port>/<database_name>
spring.datasource.url=jdbc:postgresql://localhost:5432/AirBnb
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Database Credentials
spring.datasource.username=ram
spring.datasource.password=

# JWT issued at login and required on protected APIs. Override JWT_SECRET outside local dev.
app.jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
app.jwt.expiration-minutes=1440

# Hotel / room-type photo uploads (stored in the database as bytea)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=60MB

# Demo data (DemoDataSeeder) is off by default; the "demo" profile turns it on.
app.demo-data.enabled=false

# Razorpay (https://razorpay.com/docs/). Use TEST keys (rzp_test_...) from Dashboard > Account & Settings > API Keys.
# Put the keys in src/main/resources/razorpay-secrets.properties (git-ignored, loaded below) or set the
# RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET / RAZORPAY_WEBHOOK_SECRET environment variables (these win if both are set).
spring.config.import=optional:classpath:razorpay-secrets.properties
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
razorpay.currency=INR
# Live keys are refused unless this is explicitly set to true.
razorpay.allow-live=false

# Unpaid reservations hold their rooms this long before expiring (checked every minute).
app.booking.hold-minutes=15

# Let guests confirm a booking and pay at the hotel instead of online.
app.payments.pay-at-hotel-enabled=true

# Repositories use native SQL (repository/query), so related entities load lazily; batch those loads
# (one query per association per page instead of one per row) to avoid N+1 queries.
spring.jpa.properties.hibernate.default_batch_fetch_size=100
