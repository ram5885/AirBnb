# Local development/demo profile: run with --spring.profiles.active=demo (or SPRING_PROFILES_ACTIVE=demo).
# Never enable this profile in production; DemoDataSeeder also refuses to run under prod/production profiles.

# Keep data between restarts so the seeded dataset persists and seeding stays incremental
# (the default profile uses create-drop, which wipes the database on every start).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.demo-data.enabled=true
# Password for every demo account (stored BCrypt-hashed). Override with DEMO_PASSWORD.
app.demo-data.password=${DEMO_PASSWORD:Demo@12345}
# Folder containing users.csv, guest_profiles.csv, hotels.csv, room_types.csv and bookings.csv.
# Point it at a folder on disk (e.g. file:/path/to/demo/) to use your own dataset without rebuilding.
app.demo-data.location=classpath:data/demo/
