# Test-only overrides (classpath:config/ takes precedence over the main application.properties).
# Tests use their own database: with create-drop they drop every table when they finish, which would
# break an app running against the development database. Create it once with: createdb AirBnb_test
spring.datasource.url=jdbc:postgresql://localhost:5432/AirBnb_test
# Each test run starts from an empty schema (tests assert exact counts), whatever the main file uses.
spring.jpa.hibernate.ddl-auto=create-drop
