spring.application.name=review-service
server.port=${SERVER_PORT:8084}

# Own schema only (role review_svc owns schema "review"; no grants on other services' schemas).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/airbnb?currentSchema=review}
spring.datasource.username=${DB_USERNAME:review_svc}
spring.datasource.password=${DB_PASSWORD:}

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates the mapping.
spring.flyway.schemas=review
spring.flyway.default-schema=review
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Validates the JWTs issued by auth-service (shared HS256 key). Required: no default on purpose.
app.jwt.secret=${JWT_SECRET}
# Shared secret for /internal/** service-to-service calls. Required.
app.internal-api-token=${INTERNAL_API_TOKEN}
# Other services (Docker DNS names in compose).
app.services.catalog-url=${CATALOG_SERVICE_URL:http://localhost:8082}
app.services.booking-url=${BOOKING_SERVICE_URL:http://localhost:8083}
app.services.auth-url=${AUTH_SERVICE_URL:http://localhost:8081}

# Logs: app.log / access.log / audit.log in this folder (Docker: /app/logs, mounted to ./logs/<service>/ on the host).
app.logging.dir=${LOG_DIR:logs}
# Our classes log at INFO by default; set APP_LOG_LEVEL=DEBUG to trace every controller/service call.
logging.level.com.HotelManagement=${APP_LOG_LEVEL:INFO}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
