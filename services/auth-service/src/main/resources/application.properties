spring.application.name=auth-service
server.port=${SERVER_PORT:8081}

# Own schema only (role auth_svc owns schema "auth"; no grants on other services' schemas).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/airbnb?currentSchema=auth}
spring.datasource.username=${DB_USERNAME:auth_svc}
spring.datasource.password=${DB_PASSWORD:}

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates the mapping.
spring.flyway.schemas=auth
spring.flyway.default-schema=auth
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Signing key for the JWTs issued at login (HS256, >= 32 bytes). Required: no default on purpose.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# Shared secret for /internal/** service-to-service calls. Required.
app.internal-api-token=${INTERNAL_API_TOKEN}

# Logs: app.log / access.log / audit.log in this folder (Docker: /app/logs, mounted to ./logs/<service>/ on the host).
app.logging.dir=${LOG_DIR:logs}
# Our classes log at INFO by default; set APP_LOG_LEVEL=DEBUG to trace every controller/service call.
logging.level.com.HotelManagement=${APP_LOG_LEVEL:INFO}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
