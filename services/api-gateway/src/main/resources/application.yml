server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 30s
          default-filters:
            # Only services may send the internal token; never forward one supplied by a client.
            - RemoveRequestHeader=X-Internal-Token
          # Order matters: review paths live under /api/v1/hotels/** but belong to review-service.
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
            - id: review-service
              uri: ${REVIEW_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/hotels/*/reviews,/api/v1/hotels/*/reviews/**
            - id: booking-service
              uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/bookings,/api/v1/bookings/**,/api/v1/guests,/api/v1/guests/**,/api/v1/payments/**,/api/v1/admin/bookings,/api/v1/admin/bookings/**,/api/v1/admin/dashboard
              metadata:
                # Payment verification calls Razorpay (fetch + capture, up to 15 s each).
                response-timeout: 60000
            - id: catalog-service
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/locations,/api/locations/**,/api/v1/amenities,/api/v1/hotels/**,/api/v1/admin/hotels,/api/v1/admin/hotels/**
              metadata:
                # Photo uploads (up to 10 x 5 MB) go through here.
                response-timeout: 60000

app:
  # Validates the JWTs issued by auth-service (shared HS256 key). Required: no default on purpose.
  jwt:
    secret: ${JWT_SECRET}
  internal-api-token: ${INTERNAL_API_TOKEN}
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  # Browser origins allowed to call the API directly (the bundled frontend uses same-origin /api, no CORS needed).
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
  # How long a "this account still exists" answer from auth-service is reused.
  session-check-ttl-seconds: ${SESSION_CHECK_TTL_SECONDS:60}
  # Logs: app.log / access.log / audit.log in this folder (Docker: /app/logs → ./logs/api-gateway/ on the host).
  logging:
    dir: ${LOG_DIR:logs}

logging:
  level:
    # Our classes at INFO; APP_LOG_LEVEL=DEBUG traces every session check and error response.
    com.HotelManagement: ${APP_LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
