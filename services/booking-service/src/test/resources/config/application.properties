# Test-only overrides (classpath:config/ wins over the main application.properties).
# Tests use their own local database; create it once with ../../scripts/create-test-databases.sh.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/airbnb_services_test}?currentSchema=booking
spring.datasource.username=${TEST_DB_USERNAME:${user.name}}
spring.datasource.password=${TEST_DB_PASSWORD:}
# Every run starts from an empty schema (TestFlywayConfig cleans this service's schema only).
spring.flyway.clean-disabled=false
app.jwt.secret=test-only-jwt-secret-0123456789abcdef-0123456789
app.internal-api-token=test-internal-token-0123456789
# Background jobs are driven explicitly by the tests.
app.booking.expiry-check-ms=3600000
app.booking.release-retry-ms=3600000
app.booking.reconcile-ms=3600000
app.logging.dir=target/logs
