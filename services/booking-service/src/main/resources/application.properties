spring.application.name=booking-service
server.port=${SERVER_PORT:8083}

# Own schema only (role booking_svc owns schema "booking"; no grants on other services' schemas).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/airbnb?currentSchema=booking}
spring.datasource.username=${DB_USERNAME:booking_svc}
spring.datasource.password=${DB_PASSWORD:}

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates the mapping.
spring.flyway.schemas=booking
spring.flyway.default-schema=booking
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Validates the JWTs issued by auth-service (shared HS256 key). Required: no default on purpose.
app.jwt.secret=${JWT_SECRET}
# Shared secret for /internal/** service-to-service calls (both directions). Required.
app.internal-api-token=${INTERNAL_API_TOKEN}
# Other services (Docker DNS names in compose).
app.services.catalog-url=${CATALOG_SERVICE_URL:http://localhost:8082}
app.services.auth-url=${AUTH_SERVICE_URL:http://localhost:8081}

# Razorpay (https://razorpay.com/docs/). Use TEST keys (rzp_test_...) from Dashboard > Account & Settings > API Keys,
# passed as RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET / RAZORPAY_WEBHOOK_SECRET environment variables (see .env.example).
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
razorpay.api-base-url=${RAZORPAY_API_BASE_URL:https://api.razorpay.com}
razorpay.currency=INR
# Live keys are refused unless this is explicitly set to true.
razorpay.allow-live=${RAZORPAY_ALLOW_LIVE:false}

# Unpaid reservations hold their rooms this long before expiring (checked every minute).
app.booking.hold-minutes=${BOOKING_HOLD_MINUTES:15}

# Let guests confirm a booking and pay at the hotel instead of online.
app.payments.pay-at-hotel-enabled=${PAY_AT_HOTEL_ENABLED:true}

# Logs: app.log / access.log / audit.log in this folder (Docker: /app/logs, mounted to ./logs/<service>/ on the host).
app.logging.dir=${LOG_DIR:logs}
# Our classes log at INFO by default; set APP_LOG_LEVEL=DEBUG to trace every controller/service call.
logging.level.com.HotelManagement=${APP_LOG_LEVEL:INFO}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
