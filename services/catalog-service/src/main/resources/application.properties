spring.application.name=catalog-service
server.port=${SERVER_PORT:8082}

# Own schema only (role catalog_svc owns schema "catalog"; no grants on other services' schemas).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/airbnb?currentSchema=catalog}
spring.datasource.username=${DB_USERNAME:catalog_svc}
spring.datasource.password=${DB_PASSWORD:}

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates the mapping.
spring.flyway.schemas=catalog
spring.flyway.default-schema=catalog
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Repositories use native SQL (repository/query), so related entities load lazily; batch those loads
# (one query per association per page instead of one per row) to avoid N+1 queries.
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Validates the JWTs issued by auth-service (shared HS256 key). Required: no default on purpose.
app.jwt.secret=${JWT_SECRET}
# Shared secret for /internal/** service-to-service calls. Required.
app.internal-api-token=${INTERNAL_API_TOKEN}

# Hotel / room-type photo uploads (stored in the database as bytea)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=60MB

# Logs: app.log / access.log / audit.log in this folder (Docker: /app/logs, mounted to ./logs/<service>/ on the host).
app.logging.dir=${LOG_DIR:logs}
# Our classes log at INFO by default; set APP_LOG_LEVEL=DEBUG to trace every controller/service call.
logging.level.com.HotelManagement=${APP_LOG_LEVEL:INFO}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
