# AirBnb clone - microservices stack for local development (Docker Desktop).
#   cp .env.example .env   # then fill in the secrets (see docs/DOCKER_SETUP.md)
#   docker compose up -d --build
# Browser: http://localhost:3000   API (gateway): http://localhost:8080
# Only the frontend and the gateway publish ports; databases and services are internal.
# Logs: ./logs/<service>/{app,access,audit}.log on the host (and `docker compose logs`).

name: airbnb

x-java-service: &java-service
  restart: unless-stopped
  networks: [airbnb]
  # The JVM sizes its heap from this (MaxRAMPercentage=75).
  mem_limit: ${JAVA_MEM_LIMIT:-768m}
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-common-env: &common-env
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
  JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
  TZ: ${TZ:-Asia/Kolkata}
  # INFO by default; DEBUG traces every controller call, internal call and error response.
  APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: airbnb
      POSTGRES_USER: ${POSTGRES_USER:-airbnb_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD in .env}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?set BOOKING_DB_PASSWORD in .env}
      REVIEW_DB_PASSWORD: ${REVIEW_DB_PASSWORD:?set REVIEW_DB_PASSWORD in .env}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      # Named volume: data survives `docker compose down`, restarts and image rebuilds.
      # (PostgreSQL 18 images keep their data under /var/lib/postgresql/<major>/docker.)
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d airbnb"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [airbnb]

  auth-service:
    <<: *java-service
    build: ./services/auth-service
    image: airbnb/auth-service:local
    volumes:
      # app.log / access.log / audit.log, readable on the host
      - ${LOG_ROOT:-./logs}/auth-service:/app/logs
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/airbnb?currentSchema=auth
      DB_USERNAME: auth_svc
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }

  catalog-service:
    <<: *java-service
    build: ./services/catalog-service
    image: airbnb/catalog-service:local
    volumes:
      # app.log / access.log / audit.log, readable on the host
      - ${LOG_ROOT:-./logs}/catalog-service:/app/logs
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/airbnb?currentSchema=catalog
      DB_USERNAME: catalog_svc
      DB_PASSWORD: ${CATALOG_DB_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }

  booking-service:
    <<: *java-service
    build: ./services/booking-service
    image: airbnb/booking-service:local
    volumes:
      # app.log / access.log / audit.log, readable on the host
      - ${LOG_ROOT:-./logs}/booking-service:/app/logs
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/airbnb?currentSchema=booking
      DB_USERNAME: booking_svc
      DB_PASSWORD: ${BOOKING_DB_PASSWORD}
      CATALOG_SERVICE_URL: http://catalog-service:8082
      AUTH_SERVICE_URL: http://auth-service:8081
      # Razorpay TEST mode only (rzp_test_...). Empty = online payments disabled, pay at hotel still works.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_API_BASE_URL: ${RAZORPAY_API_BASE_URL:-https://api.razorpay.com}
      RAZORPAY_ALLOW_LIVE: "false"
      BOOKING_HOLD_MINUTES: ${BOOKING_HOLD_MINUTES:-15}
    depends_on:
      postgres: { condition: service_healthy }
      catalog-service: { condition: service_healthy }
      auth-service: { condition: service_healthy }

  review-service:
    <<: *java-service
    build: ./services/review-service
    image: airbnb/review-service:local
    volumes:
      # app.log / access.log / audit.log, readable on the host
      - ${LOG_ROOT:-./logs}/review-service:/app/logs
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/airbnb?currentSchema=review
      DB_USERNAME: review_svc
      DB_PASSWORD: ${REVIEW_DB_PASSWORD}
      CATALOG_SERVICE_URL: http://catalog-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      postgres: { condition: service_healthy }
      catalog-service: { condition: service_healthy }
      booking-service: { condition: service_healthy }
      auth-service: { condition: service_healthy }

  api-gateway:
    <<: *java-service
    build: ./services/api-gateway
    image: airbnb/api-gateway:local
    volumes:
      # app.log / access.log / audit.log, readable on the host
      - ${LOG_ROOT:-./logs}/api-gateway:/app/logs
    environment:
      <<: *common-env
      AUTH_SERVICE_URL: http://auth-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      REVIEW_SERVICE_URL: http://review-service:8084
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
    ports:
      # Bound to localhost only: for API testing and the Vite dev server, not exposed to the network.
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      auth-service: { condition: service_healthy }
      catalog-service: { condition: service_healthy }
      booking-service: { condition: service_healthy }
      review-service: { condition: service_healthy }

  frontend:
    build: ./frontend
    image: airbnb/frontend:local
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      # nginx access.log (with the request id) and error.log, readable on the host
      - ${LOG_ROOT:-./logs}/frontend:/var/log/nginx
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      api-gateway: { condition: service_healthy }
    networks: [airbnb]

volumes:
  pgdata:
    # Fixed name so the data is easy to find and back up; override only for a separate stack (e.g. E2E tests).
    name: ${PGDATA_VOLUME:-airbnb_pgdata}

networks:
  airbnb: {}
