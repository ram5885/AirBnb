# React SPA + reverse proxy to the API gateway (Docker service name, never localhost).

# Access log with the request id nginx generates for every request ($request_id). The same id is sent to the gateway
# as X-Request-Id, so it appears in the gateway's and every service's logs.
log_format traced '$time_iso8601 req=$request_id ip=$remote_addr "$request" status=$status bytes=$body_bytes_sent '
                  '${request_time}s upstream=${upstream_response_time}s "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # File (mounted to ./logs/frontend/ on the host) and stdout (docker compose logs frontend).
    access_log /var/log/nginx/access.log traced;
    access_log /dev/stdout traced;
    error_log /var/log/nginx/error.log warn;
    error_log /dev/stderr warn;

    # Hotel/room photo uploads: up to 10 photos x 5 MB per request (matches the services' multipart limits).
    client_max_body_size 60m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        # Payment verification can wait on Razorpay; the gateway's own limit is 60 s.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_request_buffering off;
    }

    # Hashed build assets can be cached; index.html must not be, so new deployments are picked up.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
